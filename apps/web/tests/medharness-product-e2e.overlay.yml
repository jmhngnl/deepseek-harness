# Populated product E2E: the MedHarness product over the generic Web tree, with
# a hand-written model.
#
# Only the model is scripted. Everything below the `llm-scripted` row is the
# real thing: the agent loop, the tool registry, the medical domain, the
# session events, the projection, and the wire the browser reads. The script
# below is therefore a model's DECISIONS, not an outcome — the case calls the
# real tools and the real domain decides what the record becomes.
#
# The default-model row is restated so the agent selects the scripted route.
# It is applied after the scaffold's own row, so this is the one in force.

- id: agent-default-model
  config:
    provider: medharness-e2e
    model: scripted

- insert:
    # ── The medical runtime ─────────────────────────────────────────────────
    - id: medical-case
      name: '@deepseek-ai/dsh-medical-case'
    - id: medical-image
      name: '@deepseek-ai/dsh-medical-image'
    # The two tools this scenario drives. Registered for real, so the model's
    # arguments are validated by the same schema a deployment would use.
    - id: tool-medical-case-intake
      name: '@deepseek-ai/dsh-tool-medical-case-intake'
    - id: tool-medical-case-update
      name: '@deepseek-ai/dsh-tool-medical-case-update'
    # The image tool the third turn drives. Its schema is what validates the
    # substituted attachment id, so the id is checked by the real contract.
    - id: tool-medical-image-observe
      name: '@deepseek-ai/dsh-tool-medical-image-observe'

    # ── The product surface ─────────────────────────────────────────────────
    - id: ui-medharness
      name: '@deepseek-ai/dsh-client-ui-medharness'

    # ── The scripted model (the only mock in this composition) ──────────────
    #
    # One entry per model call, consumed in order. The tool results are real
    # messages on the way back in, which is what makes the third and fourth
    # entries a continuation rather than a claim.
    - id: llm-scripted
      name: '@deepseek-ai/dsh-llm-scripted'
      config:
        provider: medharness-e2e
        model: scripted
        steps:
          # Turn 1: the user says "我头疼两天，还有点发烧".
          - tool: medical_case_intake
            args:
              symptoms: ['头疼', '发烧']
              duration: 两天
          # Continuation after the real tool result: ask for what is missing.
          - text: 请问您的年龄是多少？
          # Turn 2: the user answers "25岁".
          - tool: medical_case_update
            args:
              age: 25
          # Continuation after the real tool result.
          - text: 已记录，谢谢您。

          # ── Turn 3: the person attaches an image ──────────────────────────
          #
          # The attachment id is not written here. The adapter substitutes the
          # canonical id of the newest image in the REQUEST, which is the one the
          # browser uploaded — so the script states a decision, not an identity,
          # and cannot go stale if the fixture changes.
          - tool: medical_image_observe
            args:
              attachmentId: $latestImageAttachmentId
              bodyRegion: 左前臂
              findings:
                - 可见局部红色斑片
                - 表面轻微隆起
              usable: true
              qualityIssues: []
              uncertainty:
                - 单张二维图像无法判断深度
          # Continuation after the real tool result.
          - text: 已记录这张图片中的可见信息。

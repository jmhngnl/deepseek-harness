# The MedHarness overlay: the last patch layer over the shipped profiles.
#
# Applied explicitly, never implicitly:
#
#   pnpm dsh web --patch ./medharness/cordis.patch.yml
#   pnpm dsh --profile headless --patch ./medharness/cordis.patch.yml "task"
#
# Keeping the MedHarness rows in their own overlay — rather than editing
# `packages/bundle/base/cordis.patch.yml` — is what lets the fork run on the
# frozen `medharness-base-20260915` baseline with zero changes to Harness core
# or to the shipped bundle layers. Every row here addresses the host plane: a
# plugin mounted at the root registers into the global tool layer, and each
# agent's scoped view sees it unless something restricts it away.
#
# Each row names its module by a path relative to THIS FILE, which is how
# `docs/user/develop/basic/index.md` mounts a local plugin. Two properties are
# worth stating because both were measured, not assumed:
#
#   * A relative path resolves against the overlay's own directory, not the
#     invocation's working directory. A probe at `medharness/probe.yml` spelling
#     `../packages/...` resolved to `<repo>/packages/...`; the same spelling in a
#     copy at `D:\tmp\` resolved to `D:\tmp\packages\...`. Keep the `../` prefix
#     correct for wherever this file lives.
#   * A bare `@deepseek-ai/dsh-tool-*` specifier does NOT work here, for a reason
#     that is not visible from the config layer. The Loader would resolve it
#     through the profile directory, so the row composes and `--dump-config`
#     looks correct, and `tsconfig.base.json` (generated by
#     `scripts/gen-tsconfig-paths.ts`) maps the name to source so
#     `scripts/verify-cordis-config.ts` accepts it too. But
#     `plugin-package-inventory-deepseek` resolves each active entry through
#     Node's `node_modules` lookup to report `dsh_plugin_packages` on the request
#     (`packages/llm/plugin-package-inventory-deepseek/src/index.ts`,
#     `barePackageManifest`). A workspace package that no bundle depends on is
#     absent from `$DSH_HOME/profiles/node_modules`, so that lookup returns
#     undefined and every model request dies with `REQUEST_EXTENSION`.
#
# A relative path is not a bare specifier, so the inventory falls back to
# `nearestManifest`, which walks up from the module and finds this package's
# manifest — the row then contributes its real `name`/`version` like any bundled
# plugin. Both properties were confirmed end-to-end with a live model on the
# headless profile and in the Web UI, which is the only place the inventory
# failure can surface: it happens during a model request, not at boot.
#
# The relative spelling keeps this file portable across checkouts. Its remaining
# limit is that it assumes the MedHarness packages sit inside this repository;
# the successor is a MedHarness bundle that declares the dependency (Phase 2+,
# when Case Memory and RAG need their own composition anyway).

- insert:
    # The session-backed case domain. It owns the durable `medical/case-change`
    # session event and the host-only `medicalCase` projection, and registers
    # `ctx.medicalCase`. Mounted before its consumers; each consumer declares
    # the service in `inject`, so the loader settles the order regardless.
    - id: medical-case
      name: '../packages/medical/medical-case/src/index.ts'
    # Records the case basics a user volunteers (symptoms, duration, age, optional
    # notes) and reports which required fields are still missing. It performs no
    # diagnosis, no treatment or medication recommendation, and no risk
    # assessment — it exists so the agent asks for missing facts instead of
    # inventing them.
    - id: tool-medical-case-intake
      name: '../packages/medical/tool-medical-case-intake/src/index.ts'
    # Applies one incremental change to the recorded case. An omitted field keeps
    # its value and no parameter clears one, so a follow-up answer cannot erase
    # what is already recorded.
    - id: tool-medical-case-update
      name: '../packages/medical/tool-medical-case-update/src/index.ts'
    # Reads the authoritative case record back without changing it, so the agent
    # consults durable session state instead of its conversation history.
    - id: tool-medical-case-get
      name: '../packages/medical/tool-medical-case-get/src/index.ts'

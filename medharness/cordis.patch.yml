# The MedHarness overlay: the last patch layer over the shipped profiles.
#
# Applied explicitly, never implicitly:
#
#   pnpm dsh web --patch ./medharness/cordis.patch.yml
#   pnpm dsh --profile headless --patch ./medharness/cordis.patch.yml "task"
#
# Two jobs live here, and they are separate on purpose.
#
# 1. THE RUNTIME TOOL SURFACE. `dsh-base` is the shared core of a *coding*
#    agent: it mounts a shell, a filesystem, background jobs, goals, todos,
#    plan mode, subagents, workflows, skills, and web search. A medical intake
#    agent needs none of them, and "the source exists" must not mean "the
#    medical agent can call it". Every row below is switched off by `id`, which
#    is the documented mechanism — a patch replaces the targeted row's whole
#    entry, so `disabled: true` here outranks the bundle that inserted it
#    (`packages/bundle/base/cordis.patch.yml` states the last-write-wins rule
#    per row). A disabled row is never mounted, so its module is never imported,
#    no service is published, and no tool reaches the request.
#    `packages/bundle/web-app/cordis.patch.yml` already uses this same shape to
#    strip the host plane, so it is the shipped convention, not a local trick.
#
# 2. THE MEDICAL DOMAIN. Four rows insert the session-backed case domain and the
#    three model-facing tools that consume it. These are additive: the shipped
#    bundles carry no medical package.
#
# Keeping both in this overlay — rather than editing
# `packages/bundle/base/cordis.patch.yml` — is what lets the fork run on the
# frozen `medharness-base-20260915` baseline with zero changes to Harness core
# or to the shipped bundle layers. A plugin mounted at the root registers into
# the global tool layer, and each agent's scoped view sees it unless something
# restricts it away, so the medical rows below land on the host plane exactly
# where the three tools are wanted.
#
# Each medical row names its module by a path relative to THIS FILE, which is
# how `docs/user/develop/basic/index.md` mounts a local plugin. Two properties
# are worth stating because both were measured, not assumed:
#
#   * A relative path resolves against the overlay's own directory, not the
#     invocation's working directory. A probe at `medharness/probe.yml` spelling
#     `../packages/...` resolved to `<repo>/packages/...`; the same spelling in a
#     copy at `D:\tmp\` resolved to `D:\tmp\packages\...`. Keep the `../` prefix
#     correct for wherever this file lives.
#   * A bare `@deepseek-ai/dsh-tool-*` specifier does NOT work here, for a reason
#     that is not visible from the config layer. The Loader would resolve it
#     through the profile directory, so the row composes and `--dump-config`
#     looks correct, and `tsconfig.base.json` (generated by
#     `scripts/gen-tsconfig-paths.ts`) maps the name to source so
#     `scripts/verify-cordis-config.ts` accepts it too. But
#     `plugin-package-inventory-deepseek` resolves each active entry through
#     Node's `node_modules` lookup to report `dsh_plugin_packages` on the request
#     (`packages/llm/plugin-package-inventory-deepseek/src/index.ts`,
#     `barePackageManifest`). A workspace package that no bundle depends on is
#     absent from `$DSH_HOME/profiles/node_modules`, so that lookup returns
#     undefined and every model request dies with `REQUEST_EXTENSION`. The
#     fallback table is built by walking the dependency closure of the
#     installation anchor, `apps/cli/package.json`
#     (`packages/boot/app-boot/src/profile.ts`, `resolveModuleFallbackEntries`),
#     and that anchor depends on every bundle but on no medical package — which
#     is exactly why the walk never reaches them.
#
# A relative path is not a bare specifier, so the inventory falls back to
# `nearestManifest`, which walks up from the module and finds this package's
# manifest — the row then contributes its real `name`/`version` like any bundled
# plugin. Both properties were confirmed end-to-end with a live model on the
# headless profile and in the Web UI, which is the only place the inventory
# failure can surface: it happens during a model request, not at boot.
#
# The relative spelling keeps this file portable across checkouts. The fixed
# form is a MedHarness bundle that declares the dependency, is listed in
# `dsh.profile.bundles`, and is carried by `apps/cli` so the closure walk finds
# it — see "Upgrading past the relative paths" in `medharness/README.md`.

# ─── 1. The coding-agent plane: off ──────────────────────────────────────────
#
# The list is the tool surface a medical intake must not have. Each id matches a
# row `packages/bundle/base/cordis.patch.yml` inserts; disabling here is what
# removes the tool from `request/header.tools`.

# Execution: no shell, in any dialect, and no background-job controls. The
# `jobs` registry itself stays mounted — it is a service other rows inject, and
# with no producer able to start a background job it cannot surface anything.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

# The shell sandboxes are also deliberately NOT disabled. They read like part of
# the shell surface, but they are the sandboxed *implementation* of the abstract
# `shell` service `packages/shell/shell` declares — the same role `fs-sandbox`
# plays for the filesystem — and `permission-presets` injects that service. The
# first draft disabled both and boot reported
# `permission (@deepseek-ai/dsh-permission-presets): pending (waiting for
# service: shell)`. Base already platform-gates them (`bash-sandbox` off on
# win32, `pwsh-sandbox` off elsewhere), which is the right pair to keep: on any
# host exactly one implementation is mounted, and with `tool-bash`/`tool-pwsh`
# disabled below nothing can reach it. Neither registers a tool, so keeping them
# leaves `request/header.tools` unchanged.

# Filesystem: no read, write, edit, glob, grep, or image read. The `fs-sandbox`
# provider and the `fs-observation-policy` reader stay: the first is a provider
# other non-tool rows resolve, the second is inert once nothing reads through it.
- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

# Planning and tracking surfaces: a medical intake conversation has no build to
# plan and no task list to keep.
- id: plan-mode
  disabled: true

- id: tool-todo
  disabled: true

# Goals: both the tool and the slash command. The `goal` domain, its round
# driver, and `tool-goal`'s host-plane service stay mounted and inert, so a
# deployment that wants goals back only has to drop these two rows.
- id: tool-goal
  disabled: true

- id: command-goal
  disabled: true

# Delegation: the four model-facing subagent tools. The in-process providers
# stay, because they are services rather than surfaces.
- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

# Workflows and Ralph iteration. `ptc-runtime` goes with them: it is the
# programmatic-tool-calling backend, and for a medical profile it is a code
# execution path that nothing needs.
- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: ptc-runtime
  disabled: true

# Network: the model-facing web tools and the providers behind them. Removing
# the providers as well as the tools is the point — it is the egress, not just
# the surface, that a medical conversation should not have.
- id: tool-web
  disabled: true

- id: web
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: web-fetch-http
  disabled: true

# Skills: loading them off the filesystem, and the tool that invokes one.
- id: skill
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: skill-badge
  disabled: true

# Repository instruction files (`AGENTS.md`, `CLAUDE.md`) are a coding-agent
# prompt source; a medical session should not inherit the repository's.
- id: agent-instructions
  disabled: true

# External tools over MCP are a later phase, and an unconfigured MCP surface
# only widens the request.
- id: mcp-resources
  disabled: true

# Telemetry is off because the subject matter is clinical. `dsh-base` ships
# `session-telemetry-otel` in `FEEDBACK_ONLY`, which exports a session-log
# prefix only after an explicit user feedback event
# (`packages/session/session-telemetry-otel/src/index.ts`: `isFeedback` matches
# `feedback/record`, `feedback/message-put`, `feedback/message-delete`), and the
# `DSH_TELEMETRY_DISABLED` switch cannot help because `config` cannot disable a
# row — the launcher patches it, and `patchReload: startup` means that decision
# is frozen at boot. Dropping the row is the only composition-level guarantee
# that a case conversation is never exported. `resolveTelemetryPatch` treats a
# composition without the row as trivially satisfied, so the environment switch
# stays valid and simply has nothing to target.
- id: session-telemetry-otel
  disabled: true

# Pin tool presentation to `native` instead of reading `DSH_TOOLS_MODE`. Base
# lets an environment variable switch the runtime into `ptc` mode, which
# replaces the medical tool schemas with a single `run_code` tool; the row it
# would need is disabled above, so the variable must not be able to steer this
# profile at all.
- id: tools
  config:
    mode: native

# ─── 2. The medical domain: on ───────────────────────────────────────────────

- insert:
    # The session-backed case domain. It owns the durable `medical/case-change`
    # session event and the host-only `medicalCase` projection, and registers
    # `ctx.medicalCase`. Mounted before its consumers; each consumer declares
    # the service in `inject`, so the loader settles the order regardless.
    - id: medical-case
      name: '../packages/medical/medical-case/src/index.ts'
    # Records the case basics a user volunteers (symptoms, duration, age, optional
    # notes) and reports which required fields are still missing. It performs no
    # diagnosis, no treatment or medication recommendation, and no risk
    # assessment — it exists so the agent asks for missing facts instead of
    # inventing them.
    - id: tool-medical-case-intake
      name: '../packages/medical/tool-medical-case-intake/src/index.ts'
    # Applies one incremental change to the recorded case. An omitted field keeps
    # its value and no parameter clears one, so a follow-up answer cannot erase
    # what is already recorded.
    - id: tool-medical-case-update
      name: '../packages/medical/tool-medical-case-update/src/index.ts'
    # Reads the authoritative case record back without changing it, so the agent
    # consults durable session state instead of its conversation history.
    - id: tool-medical-case-get
      name: '../packages/medical/tool-medical-case-get/src/index.ts'
